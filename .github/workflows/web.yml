# Builds the browser version of RustDraft from the `web` branch and publishes the built site to
# the `gh-pages` branch (built files only; nothing else is on it). Runs only in withshalom/rustdraft.
#
# One-time setup: Settings > Pages > Build and deployment > Source: "Deploy from a branch",
# Branch: gh-pages, folder: / (root). The site is then https://withshalom.github.io/rustdraft/.
name: web

on:
  push:
    branches: [web]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'withshalom/rustdraft'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable) with the wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo and target
        uses: Swatinem/rust-cache@v2
        with:
          key: web-pages

      - name: Install Trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.21.14

      - name: Build (release)
        working-directory: apps/rustdraft-web
        shell: bash
        run: |
          set -o pipefail
          if ! trunk build --release 2>&1 | tee "$RUNNER_TEMP/build.log"; then
            # The step log needs a sign-in to read; echo the first compiler errors as an annotation.
            msg=$(sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/build.log" | grep -E -A14 -m4 '^error(\[E[0-9]+\])?: ' | head -c 3500 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Build failed::${msg}"
            exit 1
          fi

      - name: Check the site uses relative URLs
        shell: bash
        run: |
          test -f dist/web/index.html
          if grep -Eq '(src|href)="/[^/]' dist/web/index.html; then
            echo "::error::dist/web/index.html has root-absolute URLs; it would break under /rustdraft/"
            exit 1
          fi
          cp packaging/web/_headers dist/web/
          touch dist/web/.nojekyll

      - name: Publish to the gh-pages branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dist/web
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Web build of ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
