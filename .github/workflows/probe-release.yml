name: probe-release
on:
  push:
    branches: [probe-release]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Same call as the draft-release action (tag v1.0.0, generated notes, environment release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "--- gh release create, exactly as the action does"
          mkdir -p a && echo hi > a/x.txt && cd a
          gh release create "v9.9.9" --draft --title "probe" --target "$GITHUB_SHA" --generate-notes -- x.txt || true
          echo "--- same with the real tag v1.0.0"
          gh release create "v1.0.0" --draft --title "probe" --target "$GITHUB_SHA" --generate-notes -- x.txt || true
          echo "--- cleanup"
          for t in v9.9.9 v1.0.0 probe-v0; do gh release delete "$t" --yes 2>&1 || true; done
          gh api repos/$GITHUB_REPOSITORY/releases --jq '.[]|"left: \(.id) \(.tag_name)"' || true
